[package]
name = "flam-launcher"
version = "0.1.0"
description = "Surcouche de bureau pour flam-player"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "flam_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "=2.5.8"
serde_json = "=1.0.154"
dirs = "=6.0.0"
uuid = { version = "=1.28.0", features = ["v4"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
png = "=0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
base64 = "=0.23.1"
sha2 = "0.10"
notify = "=8.2.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
wiremock = "0.6"
