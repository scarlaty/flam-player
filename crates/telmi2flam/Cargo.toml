[package]
name = "telmi2flam"
version = "2.0.0"
description = "Convertisseur d'histoires Telmi vers le format flam (port Rust de tools/telmi2flam)"
license = "GPL-3.0-or-later AND HPND"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "telmi2flam"
path = "src/main.rs"

[features]
# Injection de fautes du binaire (`TELMI2FLAM_TEST_FAULT`, voir src/main.rs), toujours active
# en debug ; cette feature l'active en release pour vérifier le profil `panic = "abort"`.
# Jamais activée par le launcher.
test-hooks = []

# Ce test joue aussi le faux ffmpeg (il se relance lui-même) : pas de harnais libtest.
[[test]]
name = "ffmpeg"
harness = false

[dependencies]
# Lecture ZIP faite à la main (src/zipread.rs, équivalence avec zipfile) : le décompresseur
# deflate en Rust pur (miniz_oxide) et le CRC-32 (aussi pour les chunks PNG) ; Zstandard plus
# bas.
crc32fast = "=1.5.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Dictionnaire JSON dans l'ordre d'insertion, comme `dict` de Python (clés dupliquées : la
# dernière valeur gagne, à la position de la première).
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
# Décodage PNG : inflate dans un tampon non circulaire (distances vérifiées comme zlib). Version
# déjà dans le Cargo.lock (dépendance de flate2).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# NFC / NFKD et classe combinatoire de `unicodedata`. Version épinglée : 0.1.24 porte
# Unicode 16.0.0, celui du Python 3.14 de l'installateur (0.1.25 passe à Unicode 17.0.0).
unicode-normalization = "=0.1.24"
# Méthode ZIP Zstandard (93), lue par le `zipfile` de Python 3.14 (#458) : décodeur de blocs
# en Rust pur ; trames, somme de contrôle XXH64 et contrôles de libzstd dans src/unzstd.rs.
# bzip2 et LZMA sont décodés à la main (src/unbzip2.rs, src/unlzma.rs) : `bzip2-sys` et
# `libbz2-rs-sys` sont sous licence bzip2-1.0.6 (non autorisée), `bzip2-rs` échoue sur les
# blocs incompressibles, `lzma-rs` ne lit pas un flux sans marqueur de fin.
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }
twox-hash = { version = "=2.1.5", default-features = false, features = ["std", "xxhash64"] }
# Clé SHA-256 du cache de rééchantillonnage (comme Python) ; aussi empreintes des vecteurs de
# parité PNG des tests. Déjà dans le Cargo.lock du launcher.
sha2 = { version = "=0.10.9", default-features = false }
# Décodage JPEG (#459, décision D7 : écart borné à ±4 par composante avec Pillow). Code scalaire
# seulement : sans les fonctions `x86` ni `neon`, dont les chemins SIMD sont choisis à
# l'exécution selon le processeur (invariant de déterminisme, PORT-RUST.md §4.4). Le launcher
# les active par `image` : le binaire se construit seul (`-p telmi2flam`, contrôlé par la CI
# `telmi2flam-rs`). Licence MIT OR Apache-2.0 OR Zlib (trois termes dans ALLOWED_LICENSES).
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Lecture de tests/vectors/archive/expected.json (vecteurs produits par Python).
serde_json = "=1.0.154"
