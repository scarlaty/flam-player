[package]
name = "telmi2flam"
version = "0.1.0"
description = "Convertisseur d'histoires Telmi vers le format flam (port Rust de tools/telmi2flam)"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "telmi2flam"

[dependencies]
# Décodage PNG : inflate dans un tampon non circulaire (distances vérifiées comme zlib) et CRC
# des chunks. Versions déjà dans le Cargo.lock (dépendances de flate2).
crc32fast = { version = "=1.5.2", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
# Empreintes SHA-256 des vecteurs de parité PNG (déjà dans le Cargo.lock du launcher).
sha2 = { version = "=0.10.9", default-features = false }

[[bin]]
name = "telmi2flam"
path = "src/main.rs"
