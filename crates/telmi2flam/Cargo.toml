[package]
name = "telmi2flam"
version = "0.1.0"
description = "Convertisseur d'histoires Telmi vers le format flam (port Rust de tools/telmi2flam)"
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "telmi2flam"

[[bin]]
name = "telmi2flam"
path = "src/main.rs"

[dependencies]
# Dictionnaire JSON dans l'ordre d'insertion, comme `dict` de Python (clés dupliquées : la
# dernière valeur gagne, à la position de la première).
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
# NFC / NFKD et classe combinatoire de `unicodedata`. Version épinglée : 0.1.24 porte
# Unicode 16.0.0, celui du Python 3.14 de l'installateur (0.1.25 passe à Unicode 17.0.0).
unicode-normalization = "=0.1.24"
