name: launcher

on:
  pull_request:
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "src/**"
      - "CMakeLists.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "src/**"
      - "CMakeLists.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/launcher.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: apps/flam-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SDL2, Lua, LVGL et minimp3 : sources de flam-player.exe (e2e et installateur).
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flam-launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Workspace Cargo à la racine : un seul `target/` partagé avec crates/telmi2flam.
          workspaces: ". -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Tests front
        run: npm test

      - name: Tests des scripts
        run: npm run test:scripts

      - name: rustfmt
        working-directory: apps/flam-launcher/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/flam-launcher/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        working-directory: apps/flam-launcher/src-tauri
        run: cargo test

      - name: Convertisseur embarqué (Python + Pillow, SHA-256 vérifiés)
        run: npm run build:converter

      - name: flam-player.exe et SDL2.dll (CMake, Release)
        run: npm run build:player

      - name: Licences tierces (Rust et npm)
        run: npm run build:notices

      # Version N-1 pour le test de mise à jour : mêmes sources, seule la version change (surcharge de
      # tauri.conf.json). Seul le crate de l'application est recompilé (les dépendances restent en
      # cache), puis le paquet NSIS est refait. Elle est construite AVANT la version N pour que
      # `target/release` contienne N à la fin.
      - name: Installateur NSIS N-1 (version 0.0.1, test de mise à jour)
        run: |
          printf '{"version":"0.0.1"}' > src-tauri/tauri.prev.conf.json
          npm run tauri build -- --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.prev.conf.json
          rm src-tauri/tauri.prev.conf.json

      - name: Mettre l'installateur N-1 de côté
        shell: pwsh
        run: |
          $prev = Join-Path $env:RUNNER_TEMP 'flam-installateur-prev'
          New-Item -ItemType Directory -Force $prev | Out-Null
          $setups = @(Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe")
          if ($setups.Count -ne 1 -or $setups[0].Name -notlike '*_0.0.1_*') { throw "installateur N-1 attendu (0.0.1), trouvé : $($setups.Name -join ', ')" }
          Move-Item $setups[0].FullName (Join-Path $prev 'setup-prev.exe')
          "FLAM_PREV_SETUP=$(Join-Path $prev 'setup-prev.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installateur NSIS (par utilisateur, non signé)
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json

      - name: Installer sans interaction, vérifier les fichiers
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'installateur NSIS introuvable' }
          $dest = Join-Path $env:RUNNER_TEMP 'flam-launcher-install'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installateur : code $($p.ExitCode)" }
          foreach ($f in 'flam-launcher.exe', 'flam-player.exe', 'SDL2.dll', 'LICENSES.md', 'uninstall.exe',
              'vcruntime140.dll', 'THIRD-PARTY-NOTICES.txt', 'licenses/OFL-Nunito.txt', 'licenses/OFL-Montserrat.txt', 'telmi2flam/telmi2flam.py', 'telmi2flam/python/python.exe', 'telmi2flam/runtime/script', 'licenses/SDL2-LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "fichier absent de l'installation : $f" }
          }
          # Seuil de 1000 octets : une génération qui a échoué ou vidé le fichier laisserait quelques
          # lignes d'en-tête ; le fichier réel (centaines de paquets) fait plusieurs centaines de Ko.
          if ((Get-Item (Join-Path $dest 'THIRD-PARTY-NOTICES.txt')).Length -lt 1000) { throw 'THIRD-PARTY-NOTICES.txt installé : moins de 1000 octets' }
          "FLAM_E2E_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Référence pour le test de mise à jour : arborescence (chemins + SHA-256) d'une installation propre de N.
          Get-ChildItem $dest -Recurse -File | Where-Object { $_.Name -ne 'uninstall.exe' } |
            ForEach-Object { '{0} {1}' -f $_.FullName.Substring($dest.Length), (Get-FileHash $_.FullName -Algorithm SHA256).Hash } |
            Sort-Object | Set-Content (Join-Path $env:RUNNER_TEMP 'arbre-installation-N.txt')

      - name: Mise à jour N-1 vers N par-dessus l'installation existante
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $dest = $env:FLAM_E2E_INSTALL_DIR
          $expected = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (-not $expected) { throw 'version absente de tauri.conf.json' }
          if ($expected -eq '0.0.1') { throw 'la version N doit différer de la version N-1 (0.0.1)' }
          function Get-InstalledVersion {
            # Version écrite par l'installateur NSIS (par utilisateur) dans la clé de désinstallation.
            $keys = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              Get-ItemProperty | Where-Object { $_.DisplayName -like '*Flam*' })
            if ($keys.Count -ne 1) { throw "clé de désinstallation Flam : $($keys.Count) trouvée(s), 1 attendue" }
            $keys[0].DisplayVersion
          }
          function Get-ExeVersion { (Get-Item (Join-Path $dest 'flam-launcher.exe')).VersionInfo.ProductVersion }
          function Get-Tree($dir) {
            Get-ChildItem $dir -Recurse -File | Where-Object { $_.Name -ne 'uninstall.exe' } |
              ForEach-Object { '{0} {1}' -f $_.FullName.Substring($dir.Length), (Get-FileHash $_.FullName -Algorithm SHA256).Hash } |
              Sort-Object
          }
          function Run-Setup($exe, $label) {
            $p = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$label : code $($p.ExitCode)" }
          }
          $ref = Get-Content (Join-Path $env:RUNNER_TEMP 'arbre-installation-N.txt')
          if (-not $ref) { throw 'arbre de référence de N vide' }

          # Repartir d'une machine propre : on retire l'installation de N faite à l'étape précédente.
          $u = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "désinstallation préalable : code $($u.ExitCode)" }
          Remove-Item -LiteralPath $dest -Recurse -Force

          # 1. Installer N-1 et le vérifier.
          Run-Setup $env:FLAM_PREV_SETUP 'installation N-1'
          $prevTree = Get-Tree $dest
          if (-not $prevTree) { throw 'installation N-1 vide' }
          if (-not (Compare-Object $prevTree $ref)) { throw 'N-1 identique à N : la montée de version ne teste rien' }
          $v = Get-InstalledVersion
          if ($v -ne '0.0.1') { throw "version installée après N-1 : $v (0.0.1 attendue)" }
          $ev = Get-ExeVersion
          if ($ev -ne '0.0.1' -and $ev -ne '0.0.1.0') { throw "flam-launcher.exe de N-1 : version $ev (0.0.1 attendue)" }

          # 2. Données utilisateur (hors dossier d'installation), de contenu connu et distinct.
          $keep = [ordered]@{
            (Join-Path $env:APPDATA 'flam-launcher/settings.json') = '{"langue":"fr","volume":42}'
            (Join-Path $env:LOCALAPPDATA 'flam-launcher/cache/marqueur.txt') = "marqueur`nligne 2 : é à ü"
          }
          foreach ($k in $keep.Keys) {
            New-Item -ItemType Directory -Force (Split-Path $k) | Out-Null
            [IO.File]::WriteAllText($k, $keep[$k], (New-Object Text.UTF8Encoding($false)))
          }
          # Une installation abîmée (fichier modifié, fichier supprimé) doit être réparée.
          Set-Content -LiteralPath (Join-Path $dest 'LICENSES.md') -Value 'corrompu'
          Remove-Item -LiteralPath (Join-Path $dest 'SDL2.dll')

          # 3. Installer N par-dessus.
          Run-Setup $setup.FullName 'mise à jour vers N'
          $after = Get-Tree $dest
          $diff = Compare-Object $ref $after
          if ($diff) { throw "installation différente d'une installation propre de N : $($diff | Out-String)" }
          if (-not (Test-Path (Join-Path $dest 'uninstall.exe'))) { throw 'uninstall.exe absent après mise à jour' }
          $v = Get-InstalledVersion
          if ($v -ne $expected) { throw "version installée après mise à jour : $v ($expected attendue)" }
          $ev = Get-ExeVersion
          if ($ev -ne $expected -and $ev -ne "$expected.0") { throw "flam-launcher.exe après mise à jour : version $ev ($expected attendue)" }
          foreach ($k in $keep.Keys) {
            if (-not (Test-Path -LiteralPath $k)) { throw "donnée utilisateur perdue : $k" }
            if ([IO.File]::ReadAllText($k) -ne $keep[$k]) { throw "donnée utilisateur modifiée : $k" }
            Remove-Item -LiteralPath $k
          }

      - name: Imports des binaires installés (runtime VC++ livré)
        shell: pwsh
        run: ./scripts/check-imports.ps1 -InstallDir $env:FLAM_E2E_INSTALL_DIR

      - name: Test de bout en bout sur l'application installée
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_E2E_REQUIRE: "1"
        run: cargo test --test e2e -- --nocapture

      - name: Désinstaller, vérifier qu'il ne reste rien
        shell: pwsh
        run: |
          $dest = $env:FLAM_E2E_INSTALL_DIR
          $p = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "désinstallateur : code $($p.ExitCode)" }
          # `_?=` : le désinstallateur ne s'auto-supprime pas ; tout le reste doit avoir disparu.
          $left = Get-ChildItem $dest -Recurse -Force | Where-Object { $_.Name -ne 'uninstall.exe' -and -not $_.PSIsContainer }
          if ($left) { throw "fichiers restants : $($left.FullName -join ', ')" }

      - name: Artefact (installateur NSIS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flam-launcher-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 3
