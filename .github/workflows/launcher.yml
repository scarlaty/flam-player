name: launcher

on:
  pull_request:
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/launcher.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: apps/flam-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          # SDL2, Lua, LVGL et minimp3 : sources de flam-player.exe (e2e et installateur).
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flam-launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/flam-launcher/src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Tests front
        run: npm test

      - name: rustfmt
        working-directory: apps/flam-launcher/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/flam-launcher/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        working-directory: apps/flam-launcher/src-tauri
        run: cargo test

      - name: Convertisseur embarqué (Python + Pillow, SHA-256 vérifiés)
        run: npm run build:converter

      - name: flam-player.exe et SDL2.dll (CMake, Release)
        run: npm run build:player

      - name: Installateur NSIS (par utilisateur, non signé)
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json

      - name: Installer sans interaction, vérifier les fichiers
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'installateur NSIS introuvable' }
          $dest = Join-Path $env:RUNNER_TEMP 'flam-launcher-install'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installateur : code $($p.ExitCode)" }
          foreach ($f in 'flam-launcher.exe', 'flam-player.exe', 'SDL2.dll', 'LICENSES.md', 'uninstall.exe',
              'vcruntime140.dll', 'licenses/OFL-Nunito.txt', 'licenses/OFL-Montserrat.txt', 'telmi2flam/telmi2flam.py', 'telmi2flam/python/python.exe', 'telmi2flam/runtime/script', 'licenses/SDL2-LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "fichier absent de l'installation : $f" }
          }
          "FLAM_E2E_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Imports des binaires installés (runtime VC++ livré)
        shell: pwsh
        run: ./scripts/check-imports.ps1 -InstallDir $env:FLAM_E2E_INSTALL_DIR

      - name: Test de bout en bout sur l'application installée
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_E2E_REQUIRE: "1"
        run: cargo test --test e2e -- --nocapture

      - name: Désinstaller, vérifier qu'il ne reste rien
        shell: pwsh
        run: |
          $dest = $env:FLAM_E2E_INSTALL_DIR
          $p = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "désinstallateur : code $($p.ExitCode)" }
          # `_?=` : le désinstallateur ne s'auto-supprime pas ; tout le reste doit avoir disparu.
          $left = Get-ChildItem $dest -Recurse -Force | Where-Object { $_.Name -ne 'uninstall.exe' -and -not $_.PSIsContainer }
          if ($left) { throw "fichiers restants : $($left.FullName -join ', ')" }

      - name: Artefact (installateur NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: flam-launcher-windows
          path: apps/flam-launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 3
