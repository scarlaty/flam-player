name: launcher

# `crates/**` et `Cargo.*` déclenchent ce job (~10 min) à dessein : le launcher partage le workspace
# Cargo (Cargo.lock, `target/`) avec `crates/telmi2flam` et en dépendra avec #122 ; une modification
# de la crate peut donc casser son build ou ses tests.
#
# Installateurs (#310) : sur `push` vers main, tout tourne. Sur une PR, l'installateur N (build,
# installation, e2e sur l'application installée, désinstallation, artefact) tourne toujours : l'e2e
# couvre le code applicatif. Seuls l'installateur N-1 et le test de mise à jour N-1 vers N (≈ 5 min
# de build + le scénario) sont conditionnés à l'étape « Empaquetage modifié ? » : ils tournent si la
# PR touche l'empaquetage (liste ci-dessous) ou porte le label `ci-installeur`. Poser ce label
# relance la CI (type `labeled`) ; les autres labels ne l'annulent pas (voir `concurrency`).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "tools/ffmpeg/**"
      - "src/**"
      - "CMakeLists.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "LICENSE"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "apps/flam-launcher/**"
      - "tools/telmi2flam/**"
      - "tools/ffmpeg/**"
      - "src/**"
      - "CMakeLists.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "LICENSE"
      - ".github/workflows/launcher.yml"

permissions:
  contents: read

concurrency:
  # Un label autre que `ci-installeur` déclenche un run « labeled » sans objet : groupe à part, pour
  # qu'il n'annule pas la CI en cours de la PR.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-installeur' && '-label' || '' }}
  # Sur main (push), aucune annulation : sinon chaque fusion annule la CI de la précédente et main n'a
  # plus de run complet. Un run en attente du groupe est remplacé par le plus récent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'ci-installeur') }}

jobs:
  # ffmpeg minimal (audio, LGPL) construit depuis des sources épinglées par cross-compilation
  # MinGW-w64 sous Linux (tools/ffmpeg/build.sh, #209). Le résultat est mis en cache d'après le
  # contenu de tools/ffmpeg/ puis transmis au job Windows.
  ffmpeg:
    if: github.event.action != 'labeled' || github.event.label.name == 'ci-installeur'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La clé de cache porte la version de la distribution du runner (`ImageOS`, ex. ubuntu24),
      # donc la génération de la chaîne MinGW-w64 : le binaire n'est pas reproductible d'une
      # génération à l'autre. Elle ne porte PAS `ImageVersion` : celle-ci change à chaque
      # publication hebdomadaire de l'image et invalidait le cache sans changer le binaire de
      # façon utile (#400). Les sources, leurs SHA-256 et la configuration viennent de
      # tools/ffmpeg/ (pins.env, build.sh), déjà dans le hachage.
      - name: Génération de l'image du runner
        id: image
        run: echo "version=${ImageOS:-inconnu}" >> "$GITHUB_OUTPUT"

      - name: Cache de ffmpeg construit
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out
          key: ffmpeg-win64-${{ steps.image.outputs.version }}-${{ hashFiles('tools/ffmpeg/**') }}

      - name: Construire ffmpeg (sources épinglées, SHA-256 vérifiés)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir ffmpeg-out
          INSTALL_DEPS=1 bash tools/ffmpeg/build.sh "$PWD/ffmpeg-out"

      - name: Artefact ffmpeg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-win64
          path: ffmpeg-out
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: ffmpeg
    if: github.event.action != 'labeled' || github.event.label.name == 'ci-installeur'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: apps/flam-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SDL2, Lua, LVGL et minimp3 : sources de flam-player.exe (e2e et installateur).
          submodules: recursive
          # Deux commits : sur une PR, HEAD est la fusion (base, PR) et HEAD^1 la tête de la base ;
          # `git diff HEAD^1 HEAD` donne exactement ce que la PR apporte (étape « Empaquetage modifié ? »).
          fetch-depth: 2

      # Faut-il construire N-1 et rejouer le test de mise à jour ? Oui sur tout événement autre que
      # `pull_request` (push sur main) ; sur une PR, oui si le label `ci-installeur` est posé ou si le
      # diff PR (base -> fusion de la PR) touche l'empaquetage. Liste des chemins : configuration
      # Tauri/NSIS (tauri*.json, hooks, icônes), version et dépendances (Cargo.toml, build.rs, package*.json,
      # Cargo.lock), scripts de construction des ressources embarquées et leurs sources épinglées (build-*,
      # notices, Get-InstallTree, check-imports, third-party, LICENSES.md, tools/ffmpeg), le LICENSE racine
      # (licenseFile de tauri.conf.json), ce workflow, et le socle de démarrage du launcher dont dépend le
      # scénario « application ouverte » (src-tauri/capabilities, src-tauri/src/{main,lib,app}.rs).
      # `crates/telmi2flam/` est absent de la liste À DESSEIN : le convertisseur Rust n'est pas un
      # fichier d'empaquetage (le launcher l'embarque par un script de construction déjà listé) et
      # l'e2e sur N exécute le binaire livré ; une modification de la crate ne justifie pas à elle
      # seule N-1 (~5 min).
      # Hors liste : le reste du code du player, du convertisseur et du launcher (modules métier de
      # src-tauri/src), couvert par l'e2e sur N ; surveiller tout src-tauri/src ferait tourner N-1 (~5 min)
      # sur presque toute PR du launcher, ce cas reste alors vérifié sur main (label ci-installeur pour forcer).
      # Le diff compare les deux parents de la fusion (fetch-depth: 2 ci-dessus), sans fetch par SHA.
      # Une PR d'un fork passe par la même voie (le label vient du contenu de l'événement).
      - name: Empaquetage modifié ?
        id: pkg
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Événement $EVENT : installateur N-1 et test de mise à jour exécutés."
            exit 0
          fi
          case ",$LABELS," in
            *,ci-installeur,*)
              echo "update=true" >> "$GITHUB_OUTPUT"
              echo "Label ci-installeur : installateur N-1 et test de mise à jour exécutés."
              exit 0 ;;
          esac
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Fichiers modifiés par la PR :"
          echo "$changed"
          if grep -E -q '^(apps/flam-launcher/src-tauri/(tauri[^/]*\.json|Cargo\.toml|build\.rs|icons/|windows/|capabilities/|src/(main|lib|app)\.rs$)|apps/flam-launcher/(package\.json|package-lock\.json|LICENSES\.md|third-party/|scripts/(build-|notices-lib|Get-InstallTree|check-imports))|tools/ffmpeg/|LICENSE$|Cargo\.(toml|lock)$|\.github/workflows/launcher.yml$)' <<<"$changed"; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "L'empaquetage change : installateur N-1 et test de mise à jour exécutés."
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Empaquetage inchangé : installateur N-1 et test de mise à jour sautés (label ci-installeur pour forcer)."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/flam-launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Workspace Cargo à la racine : un seul `target/` partagé avec crates/telmi2flam.
          workspaces: ". -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Tests front
        run: npm test

      - name: Tests des scripts
        run: npm run test:scripts

      - name: rustfmt
        working-directory: apps/flam-launcher/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/flam-launcher/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Les tests de pack (`install::tests::pack_tests`) lancent le faux convertisseur avec le Python
      # du PATH : sans cette exigence ils se sautent en silence quand il est absent (#426).
      - name: Tests Rust
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_REQUIRE_PATH_PYTHON: '1'
        run: cargo test

      - name: Convertisseur embarqué (Python + Pillow, SHA-256 vérifiés)
        run: npm run build:converter

      # Archive Telmi d'un pack de podcasts (#216) convertie par telmi2flam.py avec le Python
      # embarqué, puis validate.py : exigé ici (le test est ignoré sans Python dans `cargo test`).
      - name: Archive Telmi des podcasts convertie par le Python embarqué
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_TEST_REQUIRE_PYTHON: "1"
        run: |
          export FLAM_TEST_PYTHON="$(cygpath -w "$GITHUB_WORKSPACE/apps/flam-launcher/build/telmi2flam/python/python.exe")"
          out="$(cargo test --lib podcast::archive::tests::python_convertit_et_valide_l_archive -- --exact 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          # Un filtre qui ne correspond plus à aucun test (renommage) donnerait « 0 passed » en vert.
          grep -q "test result: ok. 1 passed" <<< "$out" || {
            echo "::error::Le test python_convertit_et_valide_l_archive n'a pas été exécuté (0 passed) : filtre ou nom de test à corriger."
            exit 1
          }

      - name: Télécharger ffmpeg (construit par le job ffmpeg)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-win64
          path: ffmpeg-artifact

      - name: ffmpeg LGPL embarqué (contrôles, sans GPL, libmp3lame, transcodages MP3)
        env:
          # Commit cité dans BUILD.txt : la tête de la PR (la fusion éphémère n'existera plus).
          FLAM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build:ffmpeg -- -ArtifactDir "$(cygpath -w "$GITHUB_WORKSPACE/ffmpeg-artifact")"

      # Le test bout en bout (manifeste écrit par le script + vérification Rust + lancement réel) a besoin
      # du ffmpeg construit ci-dessus : exigé ici, ignoré en local sans build.
      - name: Test du module ffmpeg sur le ffmpeg construit
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_REQUIRE_FFMPEG: '1'
        run: 'cargo test --lib -- ffmpeg:: podcast::audio::'

      # Pack de podcasts de bout en bout (#426) : serveur HTTP local de test, ffmpeg construit
      # ci-dessus, Python embarqué et vrai telmi2flam.py, jusqu'à l'histoire publiée.
      - name: Pack de podcasts de bout en bout (ffmpeg et Python embarqués)
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_REQUIRE_FFMPEG: '1'
          FLAM_TEST_REQUIRE_PYTHON: '1'
        run: |
          export FLAM_TEST_PYTHON="$(cygpath -w "$GITHUB_WORKSPACE/apps/flam-launcher/build/telmi2flam/python/python.exe")"
          out="$(cargo test --lib install::tests::pack_tests::bout_en_bout_pack_reel_jusqu_a_la_bibliotheque -- --exact 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          # Un filtre qui ne correspond plus à aucun test (renommage) donnerait « 0 passed » en vert.
          grep -q "test result: ok. 1 passed" <<< "$out" || {
            echo "::error::Le test de pack de bout en bout n'a pas été exécuté (0 passed) : filtre ou nom de test à corriger."
            exit 1
          }

      - name: flam-player.exe et SDL2.dll (CMake, Release)
        run: npm run build:player

      - name: Licences tierces (Rust et npm)
        run: npm run build:notices

      # Version N-1 pour le test de mise à jour : mêmes sources, seule la version change (surcharge de
      # tauri.conf.json), plus une ressource factice absente de N pour provoquer le cas « fichier de
      # N-1 absent de N ». La surcharge et la ressource sont écrites dans RUNNER_TEMP (jamais dans
      # l'arbre : un build en échec ne laisse rien derrière lui). Seul le crate de l'application est
      # recompilé (les dépendances restent en cache), puis le paquet NSIS est refait. Elle est
      # construite AVANT la version N pour que `target/release` contienne N à la fin. Étapes N-1 et test de
      # mise à jour : conditionnées à `steps.pkg` (voir plus haut) ; l'installateur N, lui, est toujours construit.
      - name: Installateur NSIS N-1 (version 0.0.1, test de mise à jour)
        if: steps.pkg.outputs.update == 'true'
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          printf 'ressource presente seulement dans N-1\n' > "$tmp/obsolete-n1.txt"
          printf '{"version":"0.0.1","bundle":{"resources":{"%s/obsolete-n1.txt":"obsolete-n1.txt"}}}' "$tmp" > "$tmp/tauri.prev.conf.json"
          npm run tauri build -- --config src-tauri/tauri.bundle.conf.json --config "$tmp/tauri.prev.conf.json"

      - name: Mettre l'installateur N-1 de côté
        if: steps.pkg.outputs.update == 'true'
        shell: pwsh
        run: |
          $prev = Join-Path $env:RUNNER_TEMP 'flam-installateur-prev'
          New-Item -ItemType Directory -Force $prev | Out-Null
          $setups = @(Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe")
          if ($setups.Count -ne 1 -or $setups[0].Name -notlike '*_0.0.1_*') { throw "installateur N-1 attendu (0.0.1), trouvé : $($setups.Name -join ', ')" }
          Move-Item $setups[0].FullName (Join-Path $prev 'setup-prev.exe')
          "FLAM_PREV_SETUP=$(Join-Path $prev 'setup-prev.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installateur NSIS (par utilisateur, non signé)
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json

      - name: Installer sans interaction, vérifier les fichiers
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe")
          if ($setups.Count -ne 1) { throw "installateur NSIS : 1 attendu, trouvé $($setups.Count) : $($setups.Name -join ', ')" }
          $setup = $setups[0]
          $dest = Join-Path $env:RUNNER_TEMP 'flam-launcher-install'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installateur : code $($p.ExitCode)" }
          foreach ($f in 'flam-launcher.exe', 'flam-player.exe', 'SDL2.dll', 'LICENSES.md', 'uninstall.exe',
              'vcruntime140.dll', 'THIRD-PARTY-NOTICES.txt', 'licenses/OFL-Nunito.txt', 'licenses/OFL-Montserrat.txt', 'telmi2flam/telmi2flam.py', 'telmi2flam/telmi2flam.exe', 'telmi2flam/python/python.exe', 'telmi2flam/runtime/script', 'telmi2flam/runtime/manifest.txt', 'licenses/SDL2-LICENSE.txt',
              'ffmpeg/ffmpeg.exe', 'ffmpeg/ffprobe.exe', 'ffmpeg/LICENSE', 'ffmpeg/LICENSE-LAME', 'ffmpeg/LICENSE-MINGW-RUNTIME', 'ffmpeg/BUILD.txt', 'ffmpeg/ffmpeg.sha256') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "fichier absent de l'installation : $f" }
          }
          # ffmpeg installé : ni GPL ni nonfree, libmp3lame présent (le script de build l'a déjà contrôlé,
          # ici on vérifie ce que l'installateur a réellement déposé).
          $ff = Join-Path $dest 'ffmpeg/ffmpeg.exe'
          $conf = (& $ff -hide_banner -buildconf 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $conf -match '--enable-(gpl|nonfree)(\s|$)' -or $conf -notmatch '--enable-libmp3lame') { throw "ffmpeg installé : configuration refusée`n$conf" }
          if ((& $ff -hide_banner -encoders 2>&1 | Out-String) -notmatch 'libmp3lame') { throw 'ffmpeg installé : libmp3lame absent' }
          # Seuil de 1000 octets : une génération qui a échoué ou vidé le fichier laisserait quelques
          # lignes d'en-tête ; le fichier réel (centaines de paquets) fait plusieurs centaines de Ko.
          if ((Get-Item (Join-Path $dest 'THIRD-PARTY-NOTICES.txt')).Length -lt 1000) { throw 'THIRD-PARTY-NOTICES.txt installé : moins de 1000 octets' }
          "FLAM_E2E_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Référence pour le test de mise à jour : arborescence (chemins + SHA-256) d'une installation propre de N.
          . ./scripts/Get-InstallTree.ps1
          Get-InstallTree $dest | Set-Content (Join-Path $env:RUNNER_TEMP 'arbre-installation-N.txt')

      - name: Mise à jour N-1 vers N par-dessus l'installation existante
        if: steps.pkg.outputs.update == 'true'
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "$env:GITHUB_WORKSPACE/target/release/bundle/nsis/*-setup.exe")
          if ($setups.Count -ne 1) { throw "installateur NSIS : 1 attendu, trouvé $($setups.Count) : $($setups.Name -join ', ')" }
          $setup = $setups[0]
          $dest = $env:FLAM_E2E_INSTALL_DIR
          $expected = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (-not $expected) { throw 'version absente de tauri.conf.json' }
          if ($expected -eq '0.0.1') { throw 'la version N doit différer de la version N-1 (0.0.1)' }
          function Get-InstalledVersion {
            # Version écrite par l'installateur NSIS (par utilisateur) dans la clé de désinstallation.
            $keys = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              Get-ItemProperty | Where-Object { $_.DisplayName -like '*Flam*' })
            if ($keys.Count -ne 1) { throw "clé de désinstallation Flam : $($keys.Count) trouvée(s), 1 attendue" }
            $keys[0].DisplayVersion
          }
          function Get-ExeVersion { (Get-Item (Join-Path $dest 'flam-launcher.exe')).VersionInfo.ProductVersion }
          . ./scripts/Get-InstallTree.ps1
          function Invoke-Setup($exe, $label) {
            # NSIS exige `/D=` en dernier et SANS guillemets, même si le chemin contient des espaces.
            $p = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$label : code $($p.ExitCode)" }
          }
          function Remove-InstallDir {
            # Retire le dossier d'installation juste après la désinstallation (#261). Le fichier peut rester
            # verrouillé un court instant (processus fils du désinstallateur, antivirus) : nouvelles
            # tentatives bornées (10 x 2 s) tant que le dossier existe. Ce n'est pas un masque : si le dossier
            # existe encore après la dernière tentative, l'étape échoue avec la dernière erreur.
            $err = $null
            for ($i = 1; $i -le 10; $i++) {
              if (-not (Test-Path -LiteralPath $dest)) { return }
              try {
                Remove-Item -LiteralPath $dest -Recurse -Force -ErrorAction Stop
              } catch {
                $err = $_.Exception.Message
                Write-Host "suppression de $dest : tentative $i/10 échouée ($err)"
              }
              if (-not (Test-Path -LiteralPath $dest)) { return }
              Start-Sleep -Seconds 2
            }
            if (Test-Path -LiteralPath $dest) {
              $left = @(Get-ChildItem -LiteralPath $dest -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object FullName)
              throw "dossier d'installation toujours présent après 10 tentatives (dernière erreur : $(if ($err) { $err } else { 'aucune, suppression en attente ?' })). Restant : $($left -join ', ')"
            }
          }
          $ref = Get-Content (Join-Path $env:RUNNER_TEMP 'arbre-installation-N.txt')
          if (-not $ref) { throw 'arbre de référence de N vide' }

          # Repartir d'une machine propre : on retire l'installation de N faite à l'étape précédente.
          $u = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "désinstallation préalable : code $($u.ExitCode)" }
          Remove-InstallDir

          # 1. Installer N-1 et le vérifier.
          Invoke-Setup $env:FLAM_PREV_SETUP 'installation N-1'
          $prevTree = Get-InstallTree $dest
          if (-not $prevTree) { throw 'installation N-1 vide' }
          if (-not (Compare-Object $prevTree $ref)) { throw 'N-1 identique à N : la montée de version ne teste rien' }
          $v = Get-InstalledVersion
          $obsolete = Join-Path $dest 'obsolete-n1.txt'
          if (-not (Test-Path -LiteralPath $obsolete)) { throw 'ressource factice absente de l''installation N-1 : le cas fichier supprimé n''est pas provoqué' }
          if ($v -ne '0.0.1') { throw "version installée après N-1 : $v (0.0.1 attendue)" }
          $ev = Get-ExeVersion
          if ($ev -ne '0.0.1' -and $ev -ne '0.0.1.0') { throw "flam-launcher.exe de N-1 : version $ev (0.0.1 attendue)" }

          # 2. Données utilisateur (hors dossier d'installation), de contenu connu et distinct.
          $keep = [ordered]@{
            (Join-Path $env:APPDATA 'flam-launcher/settings.json') = '{"langue":"fr","volume":42}'
            (Join-Path $env:LOCALAPPDATA 'flam-launcher/cache/marqueur.txt') = "marqueur`nligne 2 : é à ü"
          }
          foreach ($k in $keep.Keys) {
            New-Item -ItemType Directory -Force (Split-Path $k) | Out-Null
            [IO.File]::WriteAllText($k, $keep[$k], (New-Object Text.UTF8Encoding($false)))
          }
          # Une installation abîmée (fichier modifié, fichier supprimé) doit être réparée.
          Set-Content -LiteralPath (Join-Path $dest 'LICENSES.md') -Value 'corrompu'
          Remove-Item -LiteralPath (Join-Path $dest 'SDL2.dll')

          # Fichier étranger à l'application dans le dossier d'installation (dossier partagé) : jamais supprimé.
          $foreign = Join-Path $dest 'fichier-utilisateur.txt'
          Set-Content -LiteralPath $foreign -Value 'a conserver'
          $foreign2 = Join-Path $dest 'licenses/fichier-utilisateur.txt'
          Set-Content -LiteralPath $foreign2 -Value 'a conserver'
          # 3. Installer N par-dessus.
          Invoke-Setup $setup.FullName 'mise à jour vers N'
          # Fichier présent dans N-1, absent de N : l'installateur doit le supprimer (hook NSIS, #180).
          if (Test-Path -LiteralPath $obsolete) { throw 'NSIS n''a pas supprimé un fichier présent dans N-1 et absent de N (#180)' }
          if (-not (Test-Path -LiteralPath $foreign)) { throw 'fichier étranger supprimé par la mise à jour (nettoyage trop large)' }
          if (-not (Test-Path -LiteralPath $foreign2)) { throw 'fichier étranger de licenses/ supprimé par la mise à jour' }
          Remove-Item -LiteralPath $foreign, $foreign2
          $after = Get-InstallTree $dest
          $diff = Compare-Object $ref $after
          if ($diff) { throw "installation différente d'une installation propre de N : $($diff | Out-String)" }
          if (-not (Test-Path (Join-Path $dest 'uninstall.exe'))) { throw 'uninstall.exe absent après mise à jour' }
          $v = Get-InstalledVersion
          if ($v -ne $expected) { throw "version installée après mise à jour : $v ($expected attendue)" }
          $ev = Get-ExeVersion
          if ($ev -ne $expected -and $ev -ne "$expected.0") { throw "flam-launcher.exe après mise à jour : version $ev ($expected attendue)" }
          # 3 bis. Installateur corrompu en mode silencieux (#186) : le CRC de NSIS est contrôlé au
          # démarrage, avant le hook de nettoyage. L'installateur doit refuser (code non nul) sans toucher
          # à l'installation de N en place. Un octet est inversé au milieu d'une copie de l'installateur.
          $bad = Join-Path $env:RUNNER_TEMP 'setup-corrompu.exe'
          $bytes = [IO.File]::ReadAllBytes($setup.FullName)
          $bytes[[int]($bytes.Length / 2)] = $bytes[[int]($bytes.Length / 2)] -bxor 0xFF
          [IO.File]::WriteAllBytes($bad, $bytes)
          $c = Start-Process -FilePath $bad -ArgumentList @('/S', "/D=$dest") -PassThru
          if (-not $c.WaitForExit(60000)) {
            $c.Kill($true)
            throw 'installateur corrompu : pas de fin au bout de 60 s (boîte bloquante en mode silencieux ?)'
          }
          if ($c.ExitCode -eq 0) { throw 'installateur corrompu accepté en mode silencieux : le contrôle CRC ne protège pas la mise à jour' }
          $diff = Compare-Object $ref (Get-InstallTree $dest)
          if ($diff) { throw "installateur corrompu : l'installation de N a été modifiée : $($diff | Out-String)" }
          Remove-Item -LiteralPath $bad
          foreach ($k in $keep.Keys) {
            if (-not (Test-Path -LiteralPath $k)) { throw "donnée utilisateur perdue : $k" }
            if ([IO.File]::ReadAllText($k) -ne $keep[$k]) { throw "donnée utilisateur modifiée : $k" }
            Remove-Item -LiteralPath $k
          }

          # 4. Mise à jour pendant que l'application N-1 tourne (#186) : le mode silencieux ne doit ni
          # bloquer sur une boîte de dialogue invisible (CheckIfAppIsRunning de Tauri, désinstallateur de
          # N-1), ni laisser N-1 en cours d'exécution. Délai borné : au-delà, l'installateur (lancé par
          # ce script, tout comme N-1) est arrêté et l'étape échoue.
          $u = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "désinstallation avant le scénario application ouverte : code $($u.ExitCode)" }
          Remove-InstallDir
          Invoke-Setup $env:FLAM_PREV_SETUP 'installation N-1 (application ouverte)'
          $app = Start-Process -FilePath (Join-Path $dest 'flam-launcher.exe') -PassThru
          # Attendre la fenêtre (démarrage à froid de WebView2), au plus 60 s, puis une courte marge.
          $t0 = Get-Date
          while (-not $app.HasExited -and $app.MainWindowHandle -eq [IntPtr]::Zero -and ((Get-Date) - $t0).TotalSeconds -lt 60) {
            Start-Sleep -Milliseconds 500
            $app.Refresh()
          }
          Start-Sleep -Seconds 3
          if ($app.HasExited) { throw "flam-launcher.exe N-1 s'est arrêté avant la mise à jour (code $($app.ExitCode)) : le scénario n'est pas provoqué" }
          $s = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$dest") -PassThru
          if (-not $s.WaitForExit(180000)) {
            if (-not $s.HasExited) { $s.Kill($true) }
            if (-not $app.HasExited) { $app.Kill($true) }
            throw 'mise à jour avec application ouverte : pas de fin au bout de 180 s (boîte bloquante ?)'
          }
          $s.WaitForExit()
          if (-not $app.WaitForExit(30000)) {
            $app.Kill($true)
            throw "mise à jour avec application ouverte : code $($s.ExitCode), mais flam-launcher.exe N-1 tourne encore"
          }
          if ($s.ExitCode -ne 0) { throw "mise à jour avec application ouverte : code $($s.ExitCode)" }
          $diff = Compare-Object $ref (Get-InstallTree $dest)
          if ($diff) { throw "installation après mise à jour application ouverte différente d'une installation propre de N : $($diff | Out-String)" }
          $v = Get-InstalledVersion
          if ($v -ne $expected) { throw "version installée après mise à jour application ouverte : $v ($expected attendue)" }
          # L'application N-1 a pu écrire ses données utilisateur : nettoyage pour la suite.
          Remove-Item -LiteralPath (Join-Path $env:APPDATA 'flam-launcher'), (Join-Path $env:LOCALAPPDATA 'flam-launcher') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Imports des binaires installés (runtime VC++ livré)
        shell: pwsh
        run: ./scripts/check-imports.ps1 -InstallDir $env:FLAM_E2E_INSTALL_DIR

      - name: Test de bout en bout sur l'application installée
        working-directory: apps/flam-launcher/src-tauri
        env:
          FLAM_E2E_REQUIRE: "1"
        run: cargo test --test e2e -- --nocapture

      - name: Désinstaller, vérifier qu'il ne reste rien
        shell: pwsh
        run: |
          $dest = $env:FLAM_E2E_INSTALL_DIR
          $p = Start-Process -FilePath (Join-Path $dest 'uninstall.exe') -ArgumentList @('/S', "_?=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "désinstallateur : code $($p.ExitCode)" }
          # `_?=` : le désinstallateur ne s'auto-supprime pas ; tout le reste doit avoir disparu.
          $left = Get-ChildItem $dest -Recurse -Force | Where-Object { $_.Name -ne 'uninstall.exe' -and -not $_.PSIsContainer }
          if ($left) { throw "fichiers restants : $($left.FullName -join ', ')" }

      - name: Artefact (installateur NSIS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flam-launcher-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 3
