name: player

# Tests du player C et du moteur (#568) : `flam-test`, `flam-test-audio`, les `regress_/poc_/fuzz_*.lua`,
# les tests Python du convertisseur d'outils et les e2e `e2e_telmi.py` / `e2e_embed.py`, via
# `test_run.bat strict`. Ce workflow est le seul à les exécuter : ses déclencheurs couvrent tout ce dont
# ils dépendent (player, moteur, sous-modules, binaire `telmi2flam`, outils Python, runtime embarqué
# par le skill `flam-homebrew`, testé et comparé à celui de telmi2flam à l'étape 2).
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "libs/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "patches/**"
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      - "skills/flam-homebrew/assets/runtime/**"
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "test_run.bat"
      - "do_build.bat"
      - ".github/workflows/player.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "libs/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "patches/**"
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      - "skills/flam-homebrew/assets/runtime/**"
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "test_run.bat"
      - "do_build.bat"
      - ".github/workflows/player.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Sur main (push), aucune annulation : sinon chaque fusion annule la CI de la précédente et main n'a
  # plus de run complet. Un run en attente du groupe est remplacé par le plus récent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Pilotes SDL sans écran ni carte son. e2e_embed.py impose lui-même le pilote windows (HWND)
      # pour ses cas d'incrustation.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      SDL_RENDER_DRIVER: software
      # Un SKIP des etapes 3, 5 ou 6 de test_run.bat (python, telmi2flam, flam-player ou D3D11 absents)
      # est un echec en CI, pas un OK.
      FLAM_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SDL2, Lua, LVGL et minimp3 : sources de flam-player.exe.
          submodules: recursive
          persist-credentials: false

      # Python pour les étapes 5 (tests du convertisseur d'outils) et 6 (e2e) de test_run.bat. `lupa` :
      # Lua de validate.py et de l'explorateur. Même version que les autres workflows (test_parity.py).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Installer les dépendances
        run: pip install "lupa==2.8"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      # Les étapes 5 et 6 lancent le binaire Rust en processus enfant : <depot>/target/release/telmi2flam.exe,
      # chemin par défaut de converter_bin.py.
      - name: Convertisseur telmi2flam (release)
        run: cargo build -p telmi2flam --bin telmi2flam --release --locked

      # do_build.bat localise Visual Studio (vswhere), charge l'environnement x64 puis configure
      # `cmake -G Ninja -DBUILD_TESTS=ON` et compile flam-test, flam-test-audio et flam-player dans build\.
      - name: Player et tests (CMake, Ninja, BUILD_TESTS=ON)
        shell: cmd
        run: do_build.bat tests

      - name: test_run.bat strict
        shell: cmd
        run: test_run.bat strict

  # Code POSIX de src/formats/pk_reader.c (realpath, lstat, rmdir, liens symboliques) : jamais compile par
  # le job Windows ci-dessus (#575). Seul ce module et son test autonome sont compiles ici ; le reste du
  # player (SDL, LVGL, Lua) n'est pas porte sous Linux. Pas de sous-modules, pas de Python.
  pk-reader-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gnu11 (et non c11) : realpath, lstat et symlink sont des extensions POSIX. Sanitizers : acces hors
      # bornes et comportements indefinis dans le lecteur d'archives (entrees forgees par les tests).
      - name: Compiler pk_reader.c et son test (gcc, ASan et UBSan)
        run: >
          gcc -std=gnu11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=undefined
          -Isrc/formats tests/test_pk_reader.c src/formats/pk_reader.c -o "$RUNNER_TEMP/test_pk_reader"

      - name: Exécuter test_pk_reader
        run: '"$RUNNER_TEMP/test_pk_reader"'
