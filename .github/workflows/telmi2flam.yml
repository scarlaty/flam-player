name: telmi2flam

on:
  pull_request:
    paths:
      - "tools/telmi2flam/**"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
  push:
    branches: [main]
    paths:
      - "tools/telmi2flam/**"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Oracle épinglé (PORT-RUST.md §4.3) : mêmes versions que l'installateur
          # (apps/flam-launcher/scripts/build-converter.ps1, vérifié par test_parity.py).
          python-version: "3.14.8"

      - name: Installer les dépendances
        run: pip install "Pillow==12.3.0" "lupa==2.8"

      # Les tests qui exigent flam-player.exe se sautent seuls (le player C
      # n'est pas compilé dans ce workflow).
      - name: Tests unitaires
        run: python -m unittest discover -s tools/telmi2flam/tests
