name: telmi2flam

on:
  pull_request:
    paths:
      - "tools/telmi2flam/**"
      - "crates/telmi2flam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
      - ".gitattributes"
      - "crates/telmi2flam/tests/data/**"
  push:
    branches: [main]
    paths:
      - "tools/telmi2flam/**"
      - "crates/telmi2flam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
      - ".gitattributes"
      - "crates/telmi2flam/tests/data/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outils de campagne en Python (compat.py, explore.py, parity.py, validate.py) : bibliothèque
      # standard, plus `lupa` (Lua de validate.py et de l'explorateur). Ni Pillow ni oracle : le
      # convertisseur Python est supprimé, ses sorties sont figées (#140, PORT-RUST.md §4.5).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Même version dans les trois workflows (vérifié par test_parity.py).
          python-version: "3.14.8"

      - name: Installer les dépendances
        run: pip install "lupa==2.8"

      # compat.py, parity.py et les tests de l'explorateur lancent le binaire Rust en processus
      # enfant (#140) : <depot>/target/release/telmi2flam.exe, chemin par défaut de converter_bin.py.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Binaire Rust (release)
        run: cargo build -p telmi2flam --bin telmi2flam --release --locked

      # Les tests qui exigent flam-player.exe se sautent seuls (le player C
      # n'est pas compilé dans ce workflow).
      - name: Tests unitaires
        run: python -m unittest discover -s tools/telmi2flam/tests
