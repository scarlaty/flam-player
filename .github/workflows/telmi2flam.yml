name: telmi2flam

on:
  pull_request:
    paths:
      - "tools/telmi2flam/**"
      - "crates/telmi2flam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
      - ".gitattributes"
      - "crates/telmi2flam/tests/data/**"
  push:
    branches: [main]
    paths:
      - "tools/telmi2flam/**"
      - "crates/telmi2flam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
      - ".gitattributes"
      - "crates/telmi2flam/tests/data/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Oracle épinglé (PORT-RUST.md §4.3) : mêmes versions que l'installateur
          # (apps/flam-launcher/scripts/build-converter.ps1, vérifié par test_parity.py).
          python-version: "3.14.8"

      - name: Installer les dépendances
        run: pip install "Pillow==12.3.0" "lupa==2.8"

      # compat.py et les tests de l'explorateur lancent le binaire Rust en processus enfant
      # (#140) : <depot>/target/release/telmi2flam.exe, chemin par défaut de converter_bin.py.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Binaire Rust (release)
        run: cargo build -p telmi2flam --bin telmi2flam --release --locked

      # Les tests qui exigent flam-player.exe se sautent seuls (le player C
      # n'est pas compilé dans ce workflow).
      - name: Tests unitaires
        run: python -m unittest discover -s tools/telmi2flam/tests

      # Fraîcheur des vecteurs figés de la crate Rust (#351) : package_cases.zip doit être celui
      # que l'oracle (Python 3.14.8 + Pillow 12.3.0) produit aujourd'hui. Sinon : relancer
      # `python crates/telmi2flam/tests/data/gen_package_cases.py` et commiter le résultat.
      - name: Vecteurs de parité du paquet à jour
        run: python crates/telmi2flam/tests/data/gen_package_cases.py --check
