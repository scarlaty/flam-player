name: telmi2flam

on:
  pull_request:
    paths:
      - "tools/telmi2flam/**"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"
  push:
    branches: [main]
    paths:
      - "tools/telmi2flam/**"
      - "tests/e2e/**"
      - ".github/workflows/telmi2flam.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install "Pillow>=10.0" lupa

      # Les tests qui exigent flam-player.exe se sautent seuls (le player C
      # n'est pas compilé dans ce workflow).
      - name: Tests unitaires
        run: python -m unittest discover -s tools/telmi2flam/tests
