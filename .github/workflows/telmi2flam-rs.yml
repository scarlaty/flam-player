name: telmi2flam-rs

# Crate Rust `crates/telmi2flam` (port de tools/telmi2flam, voir tools/telmi2flam/PORT-RUST.md).
# Le workspace Cargo contient aussi le launcher : on ne construit ici que `-p telmi2flam`.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/telmi2flam-rs.yml"
      # La table de parité Unicode est liée à $PythonVersion (test table_produite_par_le_python...).
      - "apps/flam-launcher/scripts/build-converter.ps1"
      # Moteur et runtime embarqués dans le binaire (include_bytes!, build.rs) : #129.
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      # Oracle Python (parity.py) et générateur du corpus : #134.
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/parity/**"
      - "tools/telmi2flam/tests/test_telmi2flam.py"
      # Attributs de fin de ligne des vecteurs figés (#351).
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/telmi2flam-rs.yml"
      # La table de parité Unicode est liée à $PythonVersion (test table_produite_par_le_python...).
      - "apps/flam-launcher/scripts/build-converter.ps1"
      # Moteur et runtime embarqués dans le binaire (include_bytes!, build.rs) : #129.
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      # Oracle Python (parity.py) et générateur du corpus : #134.
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/parity/**"
      - "tools/telmi2flam/tests/test_telmi2flam.py"
      # Attributs de fin de ligne des vecteurs figés (#351).
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: rustfmt
        run: cargo fmt -p telmi2flam --check

      - name: Clippy
        run: cargo clippy -p telmi2flam --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test -p telmi2flam --locked

      - name: Binaire (release) répond à --version
        run: |
          cargo build -p telmi2flam --bin telmi2flam --release --locked
          ./target/release/telmi2flam.exe --version

      # Profil release (`panic = "abort"`, que `cargo test` n'exerce pas) : le crochet de panique
      # supprime les `.part`, émet `internal_error` et sort avec 6 (#132). Faute injectée par la
      # feature `test-hooks`, jamais activée par le launcher.
      - name: Panique en release (panic = abort)
        run: |
          cargo build -p telmi2flam --bin telmi2flam --release --locked --features test-hooks
          work="$RUNNER_TEMP/t2f-panic"
          mkdir -p "$work"
          unzip -p crates/telmi2flam/tests/data/package_cases.zip cases/ok_inventory.zip > "$work/in.zip"
          cd "$work"
          set +e
          TELMI2FLAM_TEST_FAULT=panic:zip:1 "$GITHUB_WORKSPACE/target/release/telmi2flam.exe" \
            in.zip -o out.plain.pk --plain --progress-json > events.txt
          code=$?
          set -e
          tail -n 1 events.txt
          test "$code" -eq 6
          tail -n 1 events.txt | grep -q '"code":"internal_error"'
          if ls | grep -q '\.part$'; then echo "temporaires restants"; ls; exit 1; fi
          test ! -e out.plain.pk

  # Compilation Unix (#421) : `kill_pid`, les signaux de cancel.rs et les `cfg(unix)` n'étaient
  # jamais compilés (CI Windows seulement). Clippy (`--all-targets` couvre la vérification de type de
  # toutes les cibles : un `cargo check` séparé serait redondant), puis les tests (#443).
  unix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy -p telmi2flam --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test -p telmi2flam --locked --no-fail-fast

  # Parité avec l'oracle Python (PORT-RUST.md §4.3, #134) : corpus synthétique et matrice de
  # rééchantillonnage, générés ici (jamais commités). Échoue à la moindre divergence hors de
  # la liste admise (parity.py, ALLOWED_DEVIATIONS) ; validate.py passe sur la sortie du Rust.
  parity:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Oracle épinglé (PORT-RUST.md §4.3) : mêmes versions que telmi2flam.yml et que
          # l'installateur (apps/flam-launcher/scripts/build-converter.ps1).
          python-version: "3.14.8"

      - name: Installer les dépendances de l'oracle
        run: pip install "Pillow==12.3.0" "lupa==2.8"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Binaire Rust (release)
        run: cargo build -p telmi2flam --bin telmi2flam --release --locked

      - name: Générer le corpus et la matrice
        run: python -I tools/telmi2flam/tests/parity/make_corpus.py "$RUNNER_TEMP/parity"

      - name: Parité du corpus (oracle Python contre Rust, validate.py sur la sortie Rust)
        run: |
          python -I tools/telmi2flam/parity.py corpus "$RUNNER_TEMP/parity" \
            --candidate target/release/telmi2flam.exe \
            --report "$RUNNER_TEMP/parity/corpus-report.json"

      - name: Rendu de la matrice par le Rust
        if: ${{ !cancelled() }}
        env:
          TELMI2FLAM_MATRIX_DIR: ${{ runner.temp }}/parity
          TELMI2FLAM_MATRIX_OUT: ${{ runner.temp }}/parity/matrix-rs
        run: cargo test -p telmi2flam --release --locked --test matrix_render -- --ignored

      - name: Parité de la matrice (.lif contre .lif, octet à octet)
        if: ${{ !cancelled() }}
        run: |
          python -I tools/telmi2flam/parity.py matrix "$RUNNER_TEMP/parity" \
            --candidate-lif-dir "$RUNNER_TEMP/parity/matrix-rs" \
            --report "$RUNNER_TEMP/parity/matrix-report.json"

      - name: Rapports de parité
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telmi2flam-parity
          path: |
            ${{ runner.temp }}/parity/corpus-report.json
            ${{ runner.temp }}/parity/matrix-report.json
          if-no-files-found: ignore
