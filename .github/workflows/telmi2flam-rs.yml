name: telmi2flam-rs

# Crate Rust `crates/telmi2flam` (port de tools/telmi2flam, voir tools/telmi2flam/PORT-RUST.md).
# Le workspace Cargo contient aussi le launcher : on ne construit ici que `-p telmi2flam`.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/telmi2flam-rs.yml"
      # Versions de l'oracle qui a figé les références (tables et vecteurs, test table_produite_par_le_python...).
      - "tools/telmi2flam/ORACLE-VERSIONS.txt"
      # Moteur et runtime embarqués dans le binaire (include_bytes!, build.rs) : #129.
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      # Outil de parité (parity.py, validate.py) et générateur de la matrice : #134, #140.
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/parity/**"
      # Attributs de fin de ligne des vecteurs figés (#351).
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/telmi2flam-rs.yml"
      # Versions de l'oracle qui a figé les références (tables et vecteurs, test table_produite_par_le_python...).
      - "tools/telmi2flam/ORACLE-VERSIONS.txt"
      # Moteur et runtime embarqués dans le binaire (include_bytes!, build.rs) : #129.
      - "tools/telmi2flam/engine/**"
      - "tools/telmi2flam/runtime/**"
      # Outil de parité (parity.py, validate.py) et générateur de la matrice : #134, #140.
      - "tools/telmi2flam/*.py"
      - "tools/telmi2flam/tests/parity/**"
      # Attributs de fin de ligne des vecteurs figés (#351).
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: rustfmt
        run: cargo fmt -p telmi2flam --check

      - name: Clippy
        run: cargo clippy -p telmi2flam --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test -p telmi2flam --locked

      # Déterminisme du JPEG (#459, PORT-RUST.md §4.4) : zune-jpeg choisit ses chemins AVX2/NEON
      # à l'exécution quand ses fonctions `x86`/`neon` sont compilées (`use_unsafe` ne les coupe
      # pas). Le launcher les active par `image` : le binaire doit être construit seul
      # (`-p telmi2flam`), et ce contrôle vérifie qu'alors elles sont absentes.
      - name: zune-jpeg en scalaire
        shell: pwsh
        run: |
          $tree = cargo tree -p telmi2flam -e features -i zune-jpeg --locked | Out-String
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($tree -notmatch 'zune-jpeg feature "std"' -or
              $tree -match 'zune-jpeg feature "(x86|neon|default)"') {
            Write-Output $tree
            throw "zune-jpeg compilé avec ses fonctions SIMD dans telmi2flam"
          }

      - name: Binaire (release) répond à --version
        run: |
          cargo build -p telmi2flam --bin telmi2flam --release --locked
          ./target/release/telmi2flam.exe --version

      # Profil release (`panic = "abort"`, que `cargo test` n'exerce pas) : le crochet de panique
      # supprime les `.part`, émet `internal_error` et sort avec 6 (#132). Faute injectée par la
      # feature `test-hooks`, jamais activée par le launcher.
      - name: Panique en release (panic = abort)
        run: |
          cargo build -p telmi2flam --bin telmi2flam --release --locked --features test-hooks
          work="$RUNNER_TEMP/t2f-panic"
          mkdir -p "$work"
          unzip -p crates/telmi2flam/tests/data/package_cases.zip cases/ok_inventory.zip > "$work/in.zip"
          cd "$work"
          set +e
          TELMI2FLAM_TEST_FAULT=panic:zip:1 "$GITHUB_WORKSPACE/target/release/telmi2flam.exe" \
            in.zip -o out.plain.pk --plain --progress-json > events.txt
          code=$?
          set -e
          tail -n 1 events.txt
          test "$code" -eq 6
          tail -n 1 events.txt | grep -q '"code":"internal_error"'
          if ls | grep -q '\.part$'; then echo "temporaires restants"; ls; exit 1; fi
          test ! -e out.plain.pk

  # Compilation Unix (#421) : `kill_pid`, les signaux de cancel.rs et les `cfg(unix)` n'étaient
  # jamais compilés (CI Windows seulement). Clippy (`--all-targets` couvre la vérification de type de
  # toutes les cibles : un `cargo check` séparé serait redondant), puis les tests (#443).
  unix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy -p telmi2flam --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test -p telmi2flam --locked --no-fail-fast

  # Parité avec les références figées de l'ancien oracle Python (PORT-RUST.md §4.3 et §4.5, #134,
  # #140) : corpus synthétique (archives et résultats attendus dans
  # crates/telmi2flam/tests/data/parity_corpus.zip) converti par le binaire et comparé par
  # parity.py (liste fermée ALLOWED_DEVIATIONS, validate.py sur la sortie) ; matrice de
  # rééchantillonnage générée ici sans dépendance (make_matrix.py) et comparée par
  # matrix_render.rs aux SHA-256 figés (matrix_expected.json). Ni Pillow ni oracle.
  parity:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Même version dans les trois workflows (vérifié par test_parity.py).
          python-version: "3.14.8"

      # `lupa` : contrôle de syntaxe Lua de validate.py sur la sortie du binaire.
      - name: Installer les dépendances de validate.py
        run: pip install "lupa==2.8"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # tête de la branche stable au 2026-10-16 (pas un tag)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Binaire Rust (release)
        run: cargo build -p telmi2flam --bin telmi2flam --release --locked

      - name: Parité du corpus (références figées, validate.py sur la sortie)
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          python -I tools/telmi2flam/parity.py corpus \
            --candidate target/release/telmi2flam.exe \
            --report "$RUNNER_TEMP/parity/corpus-report.json"

      - name: Générer la matrice (sans dépendance)
        if: ${{ !cancelled() }}
        run: python -I tools/telmi2flam/tests/parity/make_matrix.py "$RUNNER_TEMP/parity"

      - name: Parité de la matrice (.lif contre références figées, octet à octet)
        if: ${{ !cancelled() }}
        env:
          TELMI2FLAM_MATRIX_DIR: ${{ runner.temp }}/parity
          TELMI2FLAM_MATRIX_OUT: ${{ runner.temp }}/parity/matrix-rs
        run: cargo test -p telmi2flam --release --locked --test matrix_render -- --include-ignored

      - name: Rapports de parité
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telmi2flam-parity
          path: |
            ${{ runner.temp }}/parity/corpus-report.json
            ${{ runner.temp }}/parity/matrix-rs/ecarts.json
          if-no-files-found: ignore
